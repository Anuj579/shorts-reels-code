<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Buttons</title>
    <script src="scripts.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="flex flex-col items-center space-y-8">
        <h1 class="text-4xl font-bold text-indigo-600">Click the Button, Hear the Sound!</h1>
        <div class="flex flex-col gap-5">
            <!-- Buttons -->
            <button id="yeah" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-2xl font-semibold text-xl shadow-lg hover:shadow-xl hover:scale-110 active:scale-95 transition-all duration-300 ease-in-out cursor-pointer">
                Yeah!
            </button>
            <button id="noo" class="bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-2xl font-semibold text-xl shadow-lg hover:shadow-xl hover:scale-110 active:scale-95 transition-all duration-300 ease-in-out cursor-pointer">
                Nooo!
            </button>
            <button id="cancel" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-3 rounded-2xl font-semibold text-xl shadow-lg hover:shadow-xl hover:scale-110 active:scale-95 transition-all duration-300 ease-in-out cursor-pointer">
                Cancel
            </button>
            <button id="subscribe" class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-2xl font-semibold text-xl shadow-lg hover:shadow-xl hover:scale-110 active:scale-95 transition-all duration-300 ease-in-out cursor-pointer">
                Subscribe
            </button>
        </div>
    </div>
</body>

</html>
